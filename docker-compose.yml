services:
  db:
    image: postgres:17
    container_name: azul-db
    environment:
      POSTGRES_USER: azul
      POSTGRES_PASSWORD: azul_dev
      POSTGRES_DB: azul
    ports:
      - "5433:5432"
    volumes:
      - azul-pgdata:/var/lib/postgresql/data

  # Logs con web: http://localhost:5341 (solo desarrollo, sin usuario).
  seq:
    image: datalust/seq:latest
    container_name: azul-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - azul-seqdata:/data

volumes:
  azul-pgdata:
  azul-seqdata: